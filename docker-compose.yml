services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: etl
    ports:
      - "5432:5432"
    volumes:
      # Persist the warehouse across container restarts.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d etl"]
      interval: 3s
      timeout: 3s
      retries: 20

  etl:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    environment:
      HTTP_ADDR: ":8080"
      POLL_INTERVAL: "30s"
      FETCH_RESULTS: "10"
      API_URL: "https://randomuser.me/api/"
      API_TIMEOUT: "15s"
      DATABASE_URL: "postgres://etl:etl@postgres:5432/etl?sslmode=disable"
      DATA_DIR: "/app/data"
      LOG_PATH: "/app/logs/etl.log"
      SOURCE_NAME: "randomuser"
      SCHEMA_VERSION: "1.0.0"
    ports:
      - "8080:8080"
    volumes:
      # Host mounts simulate a durable data lake + log volume.
      # Raw     -> ./data/raw
      # Processed -> ./data/processed
      # Logs    -> ./logs/etl.log
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data:
